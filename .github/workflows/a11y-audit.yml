name: Accessibility audit

on:
  pull_request:

jobs:
  a11y-audit:
    name: Axe accessibility audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @repo/web exec playwright install --with-deps chromium

      - name: Run accessibility audit
        run: pnpm test:a11y
        env:
          # Fall back to non-empty mock values so the dev server can boot when
          # repo secrets are unset. The audit only inspects rendered HTML, so
          # bogus keys are fine — auth-gated routes simply skip per the spec.
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN || 'mock.auth0.com' }}
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID || 'mock-client-id' }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET || 'mock-client-secret' }}
          AUTH0_SECRET: ${{ secrets.AUTH0_SECRET || 'mock-secret-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://mock.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'mock-anon-key' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'mock-service-role-key' }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY || 'pk_test_mock' }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY || 'sk_test_mock' }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET || 'whsec_mock' }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL || 'http://localhost:3000' }}
          APP_SELF_ENROLL_SLUGS: "command-center,standup"

      - name: Upload axe reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a11y-audit-reports
          path: apps/web/tests/e2e/reports/a11y/
          retention-days: 14
